name: livros_jogos
description: Plataforma de histórias interativas e quadros de investigação.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  firebase_auth: ^5.3.1
  firebase_core: ^3.8.1
  flutter_secure_storage: ^9.2.2
  audioplayers: ^6.0.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/stories/
    - assets/stories/audio/
    - assets/stories/black-rain/